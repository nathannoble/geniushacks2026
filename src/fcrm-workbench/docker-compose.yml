services:
  app:
    build: .
    container_name: fcrm-app
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      - db
    volumes:
      - ./app:/app/app          # live-reload during development
    networks: [fcrm-net]

  db:
    image: pgvector/pgvector:pg16   # Postgres 16 + pgvector extension pre-installed
    container_name: fcrm-db
    environment:
      POSTGRES_USER: fcrm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: fcrm_workbench
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./infra/init-db:/docker-entrypoint-initdb.d   # schema.sql runs on first boot
    ports:
      - "5432:5432"
    networks: [fcrm-net]

  langfuse:
    image: langfuse/langfuse:2
    container_name: fcrm-langfuse
    environment:
      DATABASE_URL: postgresql://fcrm:${POSTGRES_PASSWORD}@db:5432/fcrm_workbench
      NEXTAUTH_SECRET: ${LANGFUSE_SECRET}
      SALT: ${LANGFUSE_SALT}
    ports:
      - "3001:3000"
    depends_on: [db]
    networks: [fcrm-net]

volumes:
  db-data:

networks:
  fcrm-net: